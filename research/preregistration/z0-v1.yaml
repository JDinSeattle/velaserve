schema_version: velaserve.preregistration/v1
registered_at: 2026-08-25T00:00:00Z
question: >-
  Does knowing complete fan-out width N reduce p95 group makespan or
  last-sibling TTFT by at least ten percent over frozen load-aware plus P2P?
seed: 20260825
bootstrap:
  repetitions: 10000
  confidence: 0.95
  paired_by:
    - repetition
    - fanout_width
    - prefix_regime
    - output_regime
    - arrival_skew_ms
    - load_regime
    - cache_state
    - transport
gate:
  practical_significance: 0.10
  placement_metric: p95_group_makespan_seconds
  placement_requires_adjacent_widths: 2
  source_pressure_metric: p95_last_sibling_ttft_seconds
  decisions:
    - placement
    - source-pressure
    - negative-result
z0_a:
  fanout_widths: [2, 4, 8, 16]
  epp_replicas: [1, 2]
  arrival_skew_ms: [0, 1, 5, 20]
  simulator_endpoints: 8
  load_regimes: [idle, moderate, near-saturation]
z0_b:
  comparator: arm-b-load-aware-p2p
  oracle: offline-n-aware-oracle
  feasible_k: every integer in [1, min(fanout_width, healthy_replicas)]
  confirm_simulator_opportunity_on_real_gpu: true
z0_c:
  prefix_source_counts: [1, 2, 4]
  measurements:
    - selected_source
    - concurrent_pulls_per_source
    - transfer_throughput
    - source_nic_pressure_when_observable
    - source_cpu_tier_pressure_when_observable
    - last_sibling_ttft_seconds
arms:
  primary:
    - id: arm-a-affinity-p2p
      placement: precise-prefix-affinity
      p2p: true
    - id: arm-b-load-aware-p2p
      placement: load-aware
      p2p: true
  controls:
    - id: arm-d-load-aware-no-p2p
      placement: load-aware
      p2p: false
exclusions:
  - infrastructure restart outside a declared failure experiment
  - preregistration hash mismatch
  - missing raw request or placement record
  - workload cell not generated by this preregistration
retention:
  keep_failed_runs: true
  keep_negative_runs: true
  raw_format: jsonl
  artifact_hash: sha256
upstream:
  llm_d_router: ab723b898f8598ab6631e9848a4cf28accd9b9ea
  llm_d: 3243fcf1191348b55c7811267a98117f8b7a6910
  llm_d_kv_cache: 8cf43067afb7fc9fefafc1b64de063c769f2c90f
  vllm: b1fbbc2ade51e3826bc92e4733c9c692ee21d42d

