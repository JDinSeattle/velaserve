apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velaserve-stage1
  labels:
    app.kubernetes.io/name: velaserve
spec:
  groups:
    - name: velaserve.stage1.recording
      interval: 30s
      rules:
        - record: fanoutbench:group_makespan_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (le, arm, width, load, prefix, transport) (fanoutbench_group_makespan_seconds_bucket))
        - record: fanoutbench:slowest_child_ttft_seconds:p99_5m
          expr: histogram_quantile(0.99, sum by (le, arm, width, load, prefix, transport) (fanoutbench_slowest_child_ttft_seconds_bucket))
        - record: fanoutbench:group_failure_ratio:5m
          expr: sum by (arm, width, load, prefix, transport) (fanoutbench_groups_total{outcome!="success"}) / clamp_min(sum by (arm, width, load, prefix, transport) (fanoutbench_groups_total), 1)
    - name: velaserve.stage1.alerts
      rules:
        - alert: VelaServeRunIncomplete
          expr: velaserve_zeroing_run_complete == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: VelaServe raw benchmark run is incomplete
            description: Inspect group outcomes before attempting artifact ingestion and verification.
