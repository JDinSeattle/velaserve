apiVersion: v1
kind: ConfigMap
metadata:
  name: velaserve-otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      attributes/privacy:
        actions:
          - key: prompt
            action: delete
          - key: request.body
            action: delete
          - key: response.body
            action: delete
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      debug:
        verbosity: basic
      prometheus:
        endpoint: 0.0.0.0:9464
        namespace: velaserve
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/privacy, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/privacy, batch]
          exporters: [prometheus]
