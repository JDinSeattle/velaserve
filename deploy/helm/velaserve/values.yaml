routingProfile: arm-b-load-aware-p2p
eppReplicas: 1
activeActiveObservation: false

model:
  name: velaserve-simulator
  prefixTokens: 4096
  # Real-GPU runs must supply the generated profile-freeze router override.
  minCachedTokenDelta: null
  metricsURL: http://velaserve-simfleet:8000
  targetPort: 8000
  matchLabels:
    app.kubernetes.io/name: velaserve-simfleet

images:
  velaserve:
    repository: docker.io/jdinseattle/velaserve
    tag: v0.1.0
    digest: ""
    pullPolicy: IfNotPresent
  upstreamEPP:
    registry: docker.io
    repository: velaserve-llm-d-router
    tag: git-ab723b898f8598ab6631e9848a4cf28accd9b9ea
    pullPolicy: IfNotPresent
  envoy: docker.io/envoyproxy/envoy-distroless@sha256:85500e28ed088ec39ff0adc1be3d358a8ad062926aaa62c36b28bde00919e4e8

simfleet:
  enabled: true
  replicas: 8
  port: 8000
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

fanoutbench:
  enabled: false
  endpoint: http://velaserve-epp:8081/v1/chat/completions
  profileConfigMap: velaserve-benchmark-profile
  profileKey: local-calibration.yaml
  artifactVolume:
    type: emptyDir
    claimName: ""

conditionController:
  enabled: false
  driverURL: ""
  revision: ""
  port: 8082
  applyTimeoutSeconds: 900

conditionControlSecret:
  name: ""
  key: token

conditionDriver:
  enabled: false
  port: 8083
  model: ""
  gatewayChatURL: ""
  loadProfiles: []
  loadCalibration: {}
  stabilizationSeconds: 10
  requestTimeoutSeconds: 30
  drainTimeoutSeconds: 120
  drainPollMilliseconds: 500
  endpoints: []
  authorizationSecret:
    name: ""
    key: authorization

clockProbe:
  enabled: false
  port: 8084
  maxRTTMilliseconds: 250
  maxOffsetMilliseconds: 100
  samples: 5
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi

upstream:
  llmDRouterCommit: ab723b898f8598ab6631e9848a4cf28accd9b9ea
  llmDCommit: 3243fcf1191348b55c7811267a98117f8b7a6910
  llmDKVCacheCommit: 8cf43067afb7fc9fefafc1b64de063c769f2c90f
  vllmCommit: b1fbbc2ade51e3826bc92e4733c9c692ee21d42d

evidenceScope: simulation_only
