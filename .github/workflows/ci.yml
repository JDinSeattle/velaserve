name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.6

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            versions.lock.yaml
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.cache/*' -not -path './.tools/*'))"
      - run: go vet ./...
      - run: go test ./... -count=1

  race-and-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            versions.lock.yaml
      - run: go test ./... -race -count=1
      - run: go test ./tests/property -count=20

  schemas-and-local-zeroing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            versions.lock.yaml
      - run: go run ./cmd/schema-check
      - run: go test ./tests/integration -run TestLocalZeroingProducesVerifiedSimulationOnlyBundle -count=1

  render-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            versions.lock.yaml
      - run: ./hack/bootstrap-tools.sh
      - run: jq empty deploy/observability/grafana/velaserve.json
      - run: ./hack/verify-render.sh
      - run: >-
          .tools/bin/helm lint deploy/helm/velaserve
          -f deploy/experiments/aws-z0-values.yaml
          --set images.velaserve.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set-string images.upstreamEPP.tag=git-ab723b898f8598ab6631e9848a4cf28accd9b9ea@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./hack/bootstrap-tools.sh
      - run: .tools/bin/terraform -chdir=infra/terraform fmt -check -recursive
      - run: .tools/bin/terraform -chdir=infra/terraform init -backend=false -input=false
      - run: .tools/bin/terraform -chdir=infra/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/security-audit.sh
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  stage1-audit:
    needs:
      - go-test
      - race-and-property
      - schemas-and-local-zeroing
      - render-manifests
      - terraform-validate
      - security
    runs-on: ubuntu-latest
    env:
      VELASERVE_SKIP_DOCKER: "1"
      VELASERVE_ALLOW_NO_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            versions.lock.yaml
      - run: bash scripts/verify-stage1.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-verification-${{ github.sha }}
          path: .tools/verification.json
          if-no-files-found: error
